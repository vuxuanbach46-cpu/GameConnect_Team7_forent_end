<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết bài đăng | GameConnect - Gaming Hub</title>
  <link rel="icon" href="../assets/images/logo.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/index.css">
  <style>
    [hidden], #form-error.hidden { display: none !important; }
    .sidebar-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px; border-radius: 8px; color: #a1a1aa; font-size: 13px; font-weight: 600; text-decoration: none; transition: background .15s, color .15s; }
    .sidebar-item:hover { background: #20222d; color: #fff; }
    .sidebar-item.active { background: #28211e; color: #fb923c; }
    .sidebar-item.justify-between { justify-content: space-between; }
    .top-tab { color: #a1a1aa; font-size: 12px; font-weight: 700; white-space: nowrap; text-decoration: none; }
    .top-tab:hover, .top-tab.active { color: #fb923c; }


    .btn-orange {
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      color: white;
      font-weight: 600;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(249, 115, 22, 0.3);
    }
    .btn-orange:hover {
      background: linear-gradient(135deg, #fb923c 0%, #f97316 100%);
      box-shadow: 0 6px 20px rgba(249, 115, 22, 0.45);
      transform: translateY(-1px);
    }
    .badge-open {
      background-color: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }
    .badge-closed {
      background-color: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.35);
    }
    .badge-full {
      background-color: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.35);
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #13141a; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #2a2d3a; border-radius: 3px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #f97316; }
  </style>
</head>
<body class="flex h-screen overflow-hidden select-none bg-[#0f1015] text-[#f4f4f6]">

  <!-- SIDEBAR TRÁI -->
  <aside class="w-60 bg-[#13141a] border-r border-[#242631] flex flex-col justify-between flex-shrink-0 hidden lg:flex">
    <div>
      <a href="../index.html" class="h-16 px-5 flex items-center gap-3 border-b border-[#242631]/60 hover:opacity-90 transition">
        <div class="w-8 h-8 rounded-lg bg-orange-500/15 border border-orange-500/40 flex items-center justify-center text-orange-500">
          <i class="fa-solid fa-gamepad"></i>
        </div>
        <div>
          <div class="font-bold text-sm text-white leading-tight">GameConnect</div>
          <div class="text-[10px] font-semibold tracking-widest text-zinc-500 uppercase">GAMING HUB</div>
        </div>
      </a>

      <div class="p-3 space-y-1">
        <a href="../index.html" class="sidebar-item">
          <i class="fa-solid fa-house w-4 text-center"></i>
          <span>Khám phá Hub</span>
        </a>
        <a href="team-posts.html" class="sidebar-item active">
          <i class="fa-solid fa-play w-4 text-center text-orange-500"></i>
          <span class="text-white font-semibold">Tìm đồng đội</span>
        </a>
        <a href="community.html" class="sidebar-item">
          <i class="fa-solid fa-bolt w-4 text-center"></i>
          <span>Bảng tin</span>
        </a>
        <a href="friends.html" class="sidebar-item justify-between">
          <div class="flex items-center gap-3">
            <i class="fa-solid fa-user-group w-4 text-center"></i>
            <span>Bạn bè & Kết nối</span>
          </div>
          <span class="px-1.5 py-0.5 text-[10px] font-bold rounded bg-orange-500/20 text-orange-400">20</span>
        </a>
      </div>
    </div>
  </aside>

    <div class="p-3 border-t border-[#242631]">
      <a href="team-posts.html" class="sidebar-item text-xs text-zinc-400 hover:text-white">
        <i class="fa-solid fa-arrow-left w-4 text-center"></i>
        <span>Quay lại danh sách</span>
      </a>
    </div>
  </aside>

  <!-- KHUNG CHÍNH -->
  <div class="flex-1 flex flex-col min-w-0 bg-[#0f1015]">
    <!-- Topbar -->
    <header class="h-14 bg-[#13141a] border-b border-[#242631] px-6 flex items-center justify-between flex-shrink-0">
      <div class="flex items-center gap-4">
        <a href="team-posts.html" class="text-xs text-zinc-400 hover:text-orange-400 flex items-center gap-2 transition">
          <i class="fa-solid fa-arrow-left"></i>
          <span>Quay lại Sảnh Tìm Đồng Đội</span>
        </a>
      </div>

      <div id="auth-actions" class="flex items-center gap-3">
        <a href="login.html" class="px-3.5 py-1.5 text-xs font-semibold text-zinc-300 hover:text-white bg-[#1e2029] border border-[#2e313e] rounded-lg transition">
          Đăng nhập
        </a>
      </div>
    </header>

    <!-- Main Detail Content -->
    <main class="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar max-w-5xl mx-auto w-full">
      <div id="detail-wrap">
        <!-- Skeleton Detail Loading -->
        <div class="bg-[#181920] border border-[#242631] rounded-2xl p-8 animate-pulse h-96"></div>
      </div>
    </main>
  </div>

  <!-- MODAL SỬA BÀI ĐĂNG -->
  <div id="modal-overlay" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-all" hidden>
    <div class="bg-[#13141a] border border-[#2e313e] rounded-2xl w-full max-w-xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="px-6 py-4 border-b border-[#242631] flex items-center justify-between bg-[#171821]">
        <h3 id="modal-title" class="font-bold text-base text-white">Chỉnh sửa bài đăng</h3>
        <button id="btn-close-modal" class="w-8 h-8 rounded-lg bg-[#20222d] text-zinc-400 hover:text-white flex items-center justify-center hover:bg-[#2b2e3e] transition">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="p-6 overflow-y-auto space-y-4 custom-scrollbar text-xs">
        <form id="post-form" novalidate class="space-y-4">
          <div>
            <label class="block font-semibold text-zinc-300 mb-1">Game <span class="text-orange-500">*</span></label>
            <select id="f-game" name="game_id" required
              class="w-full bg-[#181920] border border-[#2a2d3d] focus:border-orange-500 focus:ring-1 focus:ring-orange-500 text-white rounded-lg p-2.5 outline-none cursor-pointer">
              <option value="">-- Chọn game --</option>
            </select>
          </div>
          <div>
            <label class="block font-semibold text-zinc-300 mb-1">Tiêu đề bài đăng <span class="text-orange-500">*</span></label>
            <input id="f-title" name="title" type="text" maxlength="150" required
              class="w-full bg-[#181920] border border-[#2a2d3d] focus:border-orange-500 focus:ring-1 focus:ring-orange-500 text-white rounded-lg p-2.5 outline-none">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block font-semibold text-zinc-300 mb-1">Rank tối thiểu</label>
              <select id="f-min-rank" name="min_rank_id" disabled
                class="w-full bg-[#181920] border border-[#2a2d3d] text-white rounded-lg p-2.5 outline-none">
                <option value="">-- Không yêu cầu --</option>
              </select>
            </div>
            <div>
              <label class="block font-semibold text-zinc-300 mb-1">Rank tối đa</label>
              <select id="f-max-rank" name="max_rank_id" disabled
                class="w-full bg-[#181920] border border-[#2a2d3d] text-white rounded-lg p-2.5 outline-none">
                <option value="">-- Không giới hạn --</option>
              </select>
            </div>
          </div>
          <div>
            <label class="block font-semibold text-zinc-300 mb-1.5">Vai trò cần tuyển</label>
            <div id="f-roles-wrap" class="flex flex-wrap gap-2 p-3 bg-[#181920] border border-[#2a2d3d] rounded-lg min-h-[46px] items-center">
              <span class="text-zinc-500 italic text-[11px]">Vui lòng chọn game ở trên</span>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block font-semibold text-zinc-300 mb-1">Số người cần tuyển</label>
              <input id="f-needed" name="needed_players" type="number" min="1" max="50" value="1" required
                class="w-full bg-[#181920] border border-[#2a2d3d] text-white rounded-lg p-2.5 outline-none">
            </div>
            <div>
              <label class="block font-semibold text-zinc-300 mb-1">Khung giờ chơi</label>
              <input id="f-playtime" name="play_time" type="text"
                class="w-full bg-[#181920] border border-[#2a2d3d] text-white rounded-lg p-2.5 outline-none">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block font-semibold text-zinc-300 mb-1">Khu vực / Server</label>
              <select id="f-region" name="region"
                class="w-full bg-[#181920] border border-[#2a2d3d] text-white rounded-lg p-2.5 outline-none">
                <option value="">-- Không chọn --</option>
                <option value="VN">VN</option>
                <option value="SEA">SEA</option>
                <option value="NA">NA</option>
                <option value="EU">EU</option>
              </select>
            </div>
            <div>
              <label class="block font-semibold text-zinc-300 mb-1">Hạn hiển thị</label>
              <input id="f-expires" name="expires_at" type="datetime-local"
                class="w-full bg-[#181920] border border-[#2a2d3d] text-white rounded-lg p-2 outline-none text-[11px]">
            </div>
          </div>
          <div>
            <label class="block font-semibold text-zinc-300 mb-1">Mô tả chi tiết</label>
            <textarea id="f-desc" name="description" rows="3"
              class="w-full bg-[#181920] border border-[#2a2d3d] text-white rounded-lg p-2.5 outline-none"></textarea>
          </div>
          <div id="form-error" class="p-3 rounded-lg bg-red-500/15 border border-red-500/30 text-red-400 text-xs hidden"></div>
          <div class="pt-3 border-t border-[#242631] flex justify-end gap-3">
            <button type="button" id="btn-cancel-form" class="px-4 py-2 bg-[#1e2029] text-zinc-300 rounded-lg text-xs font-semibold">Huỷ</button>
            <button type="submit" id="btn-submit-post" class="btn-orange px-5 py-2 rounded-lg text-xs font-semibold">Lưu thay đổi</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- MODAL ỨNG TUYỂN VÀO ĐỘI -->
  <div id="apply-modal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-all" hidden>
    <div class="bg-[#13141a] border border-[#2e313e] rounded-2xl w-full max-w-md p-6 shadow-2xl">
      <div class="flex items-center justify-between mb-4 pb-3 border-b border-[#242631]">
        <h3 class="font-bold text-base text-white flex items-center gap-2">
          <i class="fa-solid fa-handshake text-orange-500"></i>
          <span>Ứng tuyển vào đội</span>
        </h3>
        <button id="btn-close-apply" class="text-zinc-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="space-y-4 text-xs">
        <div>
          <label class="block font-semibold text-zinc-300 mb-1.5">Lời nhắn gửi chủ đội:</label>
          <textarea id="apply-message" rows="3" placeholder="VD: Mình main Mid, rank Kim Cương, có mic Discord, chơi được 20h-24h..."
            class="w-full bg-[#181920] border border-[#2a2d3d] focus:border-orange-500 text-white rounded-lg p-3 outline-none placeholder-zinc-500"></textarea>
        </div>
        <div class="flex justify-end gap-3 pt-2">
          <button id="btn-cancel-apply" class="px-4 py-2 bg-[#1e2029] text-zinc-300 rounded-lg font-semibold">Huỷ</button>
          <button id="btn-confirm-apply" class="btn-orange px-5 py-2 rounded-lg font-semibold flex items-center gap-2">
            <i class="fa-solid fa-paper-plane"></i>
            <span>Gửi đơn ứng tuyển</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed right-5 bottom-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/pages/team-post-detail.js"></script>
  <script src="../js/index.js"></script>
</body>
</html>
