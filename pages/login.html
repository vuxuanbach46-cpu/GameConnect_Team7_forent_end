<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập | GameConnect</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Dùng chung file CSS hoặc tách riêng -->
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <!-- Thanh điều hướng có nút chuyển đổi Light / Dark Mode -->
    <header class="top-nav">
      <a href="../index.html" class="back-btn">
        <i class="fa-solid fa-chevron-left"></i> Trang chủ
      </a>

      <div class="nav-right">
        <button
          type="button"
          id="theme-toggle"
          class="theme-btn"
          title="Chuyển đổi giao diện Sáng / Tối"
        >
          <i class="fa-solid fa-sun" id="theme-icon"></i>
          <span id="theme-text">Light Mode</span>
        </button>

        <div class="brand-badge">
          <span class="gc-logo">GC</span>
          <span class="gc-text">GAMECONNECT</span>
        </div>
      </div>
    </header>

    <main class="login-container">
      <div class="login-card">
        <div class="card-header">
          <div class="gaming-icon">
            <i class="fa-solid fa-right-to-bracket"></i>
          </div>
          <h1>Đăng nhập GameConnect</h1>
          <p>Chào mừng bạn quay trở lại với cộng đồng</p>
        </div>

        <div id="alert-box" class="alert-box hidden"></div>

        <form id="login-form" class="login-form">
          <div class="form-group">
            <label for="username">Tên đăng nhập hoặc Email</label>
            <div class="input-wrapper">
              <i class="fa-regular fa-user input-icon"></i>
              <input
                type="text"
                id="username"
                placeholder="Nhập username hoặc email..."
                required
              />
            </div>
          </div>

          <div class="form-group">
            <div class="label-flex">
              <label for="password">Mật khẩu</label>
              <a href="forgot-password.html" class="forgot-link"
                >Quên mật khẩu?</a
              >
            </div>
            <div class="input-wrapper">
              <i class="fa-regular fa-lock input-icon"></i>
              <input
                type="password"
                id="password"
                placeholder="Nhập mật khẩu của bạn"
                required
              />
              <button type="button" class="toggle-password" id="toggle-pwd">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" id="submit-btn" class="btn-primary">
            Đăng nhập
          </button>
        </form>

        <div class="divider">
          <span>Hoặc đăng nhập với</span>
        </div>

        <button type="button" id="google-login-btn" class="btn-google">
          <img
            src="https://www.svgrepo.com/show/475656/google-color.svg"
            alt="Google"
          />
          <span>Google</span>
        </button>

        <div class="card-footer">
          <p>Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a></p>
        </div>
      </div>
    </main>

    <!-- 1. Thư viện Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- 2. File cấu hình API_BASE_URL -->
    <script src="../js/config.js"></script>
    <!-- 3. File định nghĩa đối tượng `api` -->
    <script src="../js/api.js"></script>
    <!-- 4. File logic xử lý của trang đăng nhập -->
    <script src="../js/login.js"></script>
  </body>
</html>
