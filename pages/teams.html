<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách đội | GameConnect</title>
    <link rel="icon" href="../assets/images/logo.svg">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/teams.css">
  <link rel="stylesheet" href="../css/team-navigation.css">
</head>

<body class="gc-team-page" data-root="../">
    <header id="app-header"></header>

    <main class="container teams-page">
        <section class="teams-heading">
            <div>
                <h1>Danh sách đội chơi</h1>
                <p class="muted">
                    Tìm kiếm đội chơi phù hợp hoặc tạo đội của riêng bạn.
                </p>
            </div>

            <button class="btn btn-primary" type="button" id="open-create-form">
                + Tạo đội mới
            </button>
        </section>

        <section class="card">
            <h2>Tìm kiếm đội</h2>

            <div class="teams-filters">
                <div>
                    <label for="team-search">Tên đội</label>
                    <input type="search" id="team-search" placeholder="Nhập tên đội...">
                </div>

                <div>
                    <label for="game-filter">Trò chơi</label>
                    <select id="game-filter">
                        <option value="">Tất cả trò chơi</option>
                    </select>
                </div>

                <button type="button" class="btn" id="reset-filter">
                    Xóa bộ lọc
                </button>
            </div>
        </section>

        <section class="teams-results">
            <div class="list-header">
                <h2>Đội chơi</h2>
                <span class="muted" id="teams-count"></span>
            </div>

            <div id="teams-message" role="status"></div>

            <div class="teams-grid" id="teams-list"></div>

            <div class="teams-pagination">
                <button type="button" class="btn" id="previous-page">
                    Trang trước
                </button>

                <span id="page-info">Trang 1</span>

                <button type="button" class="btn" id="next-page">
                    Trang sau
                </button>
            </div>
        </section>

        <section class="card create-team-section" id="create-team-section" aria-labelledby="create-team-title" hidden>
            <div class="create-team-header">
                <div class="create-team-heading">
                    <span class="create-team-icon" aria-hidden="true">✦</span>
                    <div>
                        <span class="create-team-eyebrow">KHÔNG GIAN ĐỘI</span>
                        <h2 id="create-team-title">Tạo đội mới</h2>
                        <p>Tạo một nơi để cùng đồng đội kết nối và chơi game.</p>
                    </div>
                </div>
                <button type="button" class="create-team-close" id="close-create-form" aria-label="Đóng biểu mẫu tạo đội">×</button>
            </div>

            <form id="create-team-form">
                <div class="create-team-fields">
                    <div class="create-team-field">
                        <label for="team-name">Tên đội <span aria-hidden="true">*</span></label>
                        <input type="text" id="team-name" name="name" maxlength="100" placeholder="VD: GameConnect Warriors" required>
                    </div>
                    <div class="create-team-field">
                        <label for="team-game">Trò chơi <span aria-hidden="true">*</span></label>
                        <select id="team-game" name="main_game_id" required>
                            <option value="">Chọn trò chơi</option>
                        </select>
                    </div>
                    <div class="create-team-field create-team-field--full">
                        <label for="team-description">Giới thiệu đội <span class="create-team-optional">Không bắt buộc</span></label>
                        <textarea id="team-description" name="description" rows="3" placeholder="Giới thiệu ngắn về đội và những người bạn đang tìm..."></textarea>
                    </div>
                    <div class="create-team-field">
                        <label for="team-max-members">Số thành viên tối đa <span aria-hidden="true">*</span></label>
                        <input type="number" id="team-max-members" name="max_members" min="2" max="100" value="5" required>
                    </div>
                    <div class="create-team-field">
                        <label for="team-join-mode">Hình thức tham gia</label>
                        <select id="team-join-mode" name="join_mode">
                            <option value="PUBLIC">Công khai</option>
                            <option value="APPROVAL_REQUIRED">Cần phê duyệt</option>
                        </select>
                    </div>
                    <div class="create-team-field create-team-field--full create-team-logo-field">
                        <label for="team-logo">Logo đội <span class="create-team-optional">Không bắt buộc</span></label>
                        <input type="file" id="team-logo" name="logo" accept="image/png,image/jpeg,image/webp" aria-describedby="team-logo-help">
                        <p id="team-logo-help" class="create-team-hint">JPG, PNG hoặc WEBP, tối đa 2 MB. Logo hiện chỉ xem trước; hãy bỏ trống để tạo đội.</p>
                        <div id="logo-preview-container" class="logo-preview" hidden>
                            <img id="logo-preview" alt="Logo đội xem trước">
                        </div>
                    </div>
                </div>
                <p id="create-team-message" role="status"></p>
                <div class="create-team-actions">
                    <span>Các mục có <b>*</b> là bắt buộc</span>
                    <div>
                        <button type="reset" class="btn">Nhập lại</button>
                        <button type="submit" class="btn btn-primary" id="submit-team">Tạo đội</button>
                    </div>
                </div>
            </form>
        </section>
    </main>

    <footer id="app-footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/pages/teams.js"></script>
    <script src="../js/pages/team-navigation.js"></script>
</body>

</html>
