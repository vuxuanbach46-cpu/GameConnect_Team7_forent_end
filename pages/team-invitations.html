<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lời mời vào đội | GameConnect</title>
  <link rel="icon" href="../assets/images/logo.svg">
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="../css/my-team.css">
  <link rel="stylesheet" href="../css/team-navigation.css">
  <link rel="stylesheet" href="../css/team-invitations.css">
</head>
<body class="gc-team-page" data-root="../">
  <header id="app-header"></header>
  <main class="container gc-invitations-page">
    <a class="gc-invitations-back" href="clubs.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Quay lại câu lạc bộ</a>
    <section class="gc-invitations-hero">
      <div class="gc-invitations-hero-icon"><img src="../assets/images/logo.svg" alt="GameConnect Logo" style="width: 36px; height: 36px;"></div>
      <div class="gc-invitations-heading">
        <span class="gc-invitations-eyebrow">KẾT NỐI ĐỒNG ĐỘI</span>
        <h1>Lời mời vào đội</h1>
        <p>Những lời mời tham gia đội đang chờ bạn phản hồi.</p>
      </div>
      <a class="gc-invitations-friends" href="friends.html"><i class="fa-solid fa-user-group" aria-hidden="true"></i> Bạn bè</a>
    </section>
    <section class="gc-invitations-content" aria-labelledby="invitation-section-title">
      <div class="gc-invitations-section-heading"><div><span class="gc-invitations-eyebrow">HỘP THƯ CỦA BẠN</span><h2 id="invitation-section-title">Đang chờ phản hồi</h2></div><span id="invitation-count" class="gc-invitations-count">— lời mời</span></div>
      <p id="invitation-message" class="gc-invitations-message" role="status" aria-live="polite">Đang tải lời mời...</p>
      <div id="invitation-list" class="gc-invitations-list"></div>
    </section>
  </main>
  <footer id="app-footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
