<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quên mật khẩu | GameConnect</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="stylesheet" href="../css/forgot-password.css" />
  </head>
  <body>
    <header class="top-nav">
      <a href="login.html" class="back-btn"><i class="fa-solid fa-chevron-left"></i> Đăng nhập</a>
      <div class="nav-right"><div class="brand-badge"><span class="gc-logo">GC</span><span class="gc-text">GAMECONNECT</span></div></div>
    </header>

    <main class="login-container">
      <section class="login-card forgot-card">
        <div class="card-header">
          <div class="gaming-icon"><i class="fa-solid fa-key"></i></div>
          <h1>Khôi phục mật khẩu</h1>
          <p>Nhận mã xác nhận qua email để đặt mật khẩu mới</p>
        </div>

        <div id="forgot-alert" class="alert-box hidden" role="status" aria-live="polite"></div>

        <form id="forgot-form" class="login-form">
          <div class="form-group">
            <label for="forgot-email">Địa chỉ email tài khoản</label>
            <div class="input-wrapper"><i class="fa-regular fa-envelope input-icon"></i><input id="forgot-email" type="email" autocomplete="email" placeholder="name@example.com" required /></div>
          </div>
          <button type="submit" id="send-code-btn" class="btn-primary">Gửi mã xác nhận</button>
        </form>

        <form id="reset-form" class="login-form" hidden>
          <p class="reset-email-note">Mã xác nhận được gửi tới <strong id="reset-email-label"></strong></p>
          <div class="form-group">
            <label for="reset-code">Mã xác nhận 6 số</label>
            <div class="input-wrapper"><i class="fa-solid fa-shield-halved input-icon"></i><input id="reset-code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" placeholder="123456" required /></div>
          </div>
          <div class="form-group">
            <label for="new-password">Mật khẩu mới</label>
            <div class="input-wrapper"><i class="fa-regular fa-lock input-icon"></i><input id="new-password" type="password" autocomplete="new-password" minlength="6" maxlength="128" placeholder="Tối thiểu 6 ký tự" required /></div>
          </div>
          <div class="form-group">
            <label for="confirm-new-password">Xác nhận mật khẩu mới</label>
            <div class="input-wrapper"><i class="fa-regular fa-lock input-icon"></i><input id="confirm-new-password" type="password" autocomplete="new-password" minlength="6" maxlength="128" placeholder="Nhập lại mật khẩu mới" required /></div>
          </div>
          <button type="submit" id="reset-password-btn" class="btn-primary">Đổi mật khẩu</button>
          <div class="forgot-actions"><button type="button" id="resend-code-btn" class="forgot-text-btn">Gửi lại mã</button><button type="button" id="change-email-btn" class="forgot-text-btn">Đổi email</button></div>
        </form>

        <div class="card-footer"><p>Nhớ lại mật khẩu? <a href="login.html">Đăng nhập</a></p><p>Chưa có tài khoản? <a href="register.html">Đăng ký</a></p></div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/forgot-password.js"></script>
  </body>
</html>
